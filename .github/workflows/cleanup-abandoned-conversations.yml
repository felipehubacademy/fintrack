name: Cleanup Abandoned Conversations

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
        working-directory: packages/backend
      - name: Run cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Secrets not configured — skipping."
            exit 0
          fi
          if [ ! -f "packages/backend/scripts/cleanup-abandoned-conversations.js" ]; then
            echo "Script not found — skipping."
            exit 0
          fi
          node packages/backend/scripts/cleanup-abandoned-conversations.js

